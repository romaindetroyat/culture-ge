# LOMBRIX must live in its own repository, not in Culture Ge.
# Preserve the existing source branch until the dedicated repository is verified.
# No automatic or manual deployment is permitted from this archived workflow.
name: LOMBRIX - paused pending dedicated repository
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Deployments disabled. Move LOMBRIX to its dedicated repository.'
